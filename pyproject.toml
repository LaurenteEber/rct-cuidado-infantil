[project]
name = "rct-cuidado-infantil"
version = "1.0.0"
description = "Evaluación experimental del horario ampliado de cuidado infantil sobre el empleo de las madres"
readme = "README.md"
authors = [
    { name = "Eber Laurente", email = "laurente.eber@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "linearmodels>=7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyreadstat>=1.3.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "impact_eval"
